<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seating Layout</title>
<style>
  :root {
    color-scheme: dark;
    --page: #0d1117;
    --room: #151b23;
    --seat: #202b3b;
    --seat-line: #465365;
    --fixture: #20262f;
    --fixture-line: #858f9c;
    --text: #edf1f6;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; margin: 0; }
  body {
    display: grid;
    place-items: center;
    padding: clamp(12px, 3vw, 36px);
    background: var(--page);
    color: var(--text);
    font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  main { width: min(100%, 760px); }
  .page-nav { display: flex; margin-bottom: 14px; }
  .back-link {
    display: inline-flex; align-items: center; gap: 8px;
    padding: 9px 13px; border: 1px solid var(--seat-line); border-radius: 8px;
    background: var(--seat); color: var(--text); font-size: 14px; font-weight: 600;
    text-decoration: none;
  }
  .back-link:hover { background: var(--fixture); }
  .back-link:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }
  .diagram { display: block; width: 100%; height: auto; }
  .room { fill: var(--room); stroke: #303943; stroke-width: 5; }
  .seat { fill: var(--seat); stroke: var(--seat-line); stroke-width: 3.4; }
  .seat-number {
    fill: var(--text); font-size: 18px; font-weight: 700;
    text-anchor: middle; dominant-baseline: central; font-variant-numeric: tabular-nums;
  }
  .fixture { fill: var(--fixture); stroke: var(--fixture-line); stroke-width: 2.5; }
  .fixture-label {
    fill: #d5dbe4; font-size: 19px; font-weight: 650; letter-spacing: .1px;
    text-anchor: middle; dominant-baseline: central;
  }
  .floor-label { font-size: 21px; }
  .stage-label { font-size: 19px; }
  .screen-label { font-size: 18px; }
  @media (max-width: 520px) {
    body { padding: 10px; }
    .seat-number { font-size: 18px; }
  }
  @media print {
    :root { color-scheme: light; --page: #fff; --room: #f4f6f8; --seat: #e5eaf0; --seat-line: #a6b0bc; --fixture: #e9edf1; --fixture-line: #8c96a3; --text: #1c2631; }
    body { background: #fff; padding: 0; }
    main { width: 100%; max-width: none; }
    .page-nav { display: none; }
  }
</style>
</head>
